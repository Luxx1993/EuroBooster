name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    # Nur nach einem Push auf main (also nach dem Merge) veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          mkdir -p _site/images
          cp -r index.html css js _site/
          # Nur die kleinen Kartenbilder veröffentlichen, nicht die Originale
          cp -r images/cards _site/images/
          # Münzen: nur die runden Relief-Vorlagen für den 3D-Renderer, nicht die Originale
          cp -r images/coin_web _site/images/
          # Cache umgehen: CSS und JS bekommen die Commit-Version angehängt,
          # damit Browser nach jedem Update die neuen Dateien laden
          # (GitHub Pages erlaubt sonst 10 Minuten Zwischenspeichern).
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(css/[^\"]+\.css|js/[^\"]+\.js)\"#\1=\"\2?v=${v}\"#g" _site/index.html
          grep -c "?v=${v}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
